name: Deploy FastDL

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag containing the Pages ZIP
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Pages ZIP from release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ac130-pages-*.zip" \
            --output payload.zip

      - name: Extract and check files
        run: |
          unzip -q payload.zip -d public
          test -f public/index.html
          test -f public/.nojekyll
          test -d public/materials
          test -d public/models
          test -d public/sound
          test -d public/notices

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
