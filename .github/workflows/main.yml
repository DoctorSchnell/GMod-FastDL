name: Deploy FastDL

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read repository files
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Combine releases and repository assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import shutil
          import subprocess
          import zipfile
          
          
          def build(workspace, releases, download):
              site = workspace / "public"
              site.mkdir(exist_ok=True)
              cache = workspace / ".release-downloads"
              cache.mkdir(exist_ok=True)
              published = [r for r in releases if not r.get("draft")]
              published.sort(key=lambda r: (r.get("published_at") or "", r["id"]))
              for release in published:
                  for asset in sorted(release["assets"], key=lambda a: (a.get("updated_at") or "", a["id"])):
                      name = asset["name"]
                      lower = name.lower()
                      if not lower.endswith((".zip", ".bsp", ".bsp.bz2")):
                          continue
                      if PurePosixPath(name).name != name or "\\" in name:
                          raise RuntimeError(f"Invalid release filename: {name}")
                      package = cache / str(asset["id"])
                      download(release, asset, package)
                      digest = asset.get("digest") or ""
                      if digest.startswith("sha256:"):
                          with package.open("rb") as stream:
                              actual = hashlib.file_digest(stream, "sha256").hexdigest()
                          if actual != digest.removeprefix("sha256:"):
                              raise RuntimeError(f"Release checksum mismatch: {name}")
                      print(f"Including {release['tag_name']}: {name}", flush=True)
                      if lower.endswith(".zip"):
                          with zipfile.ZipFile(package) as archive:
                              for entry in archive.infolist():
                                  relative = PurePosixPath(entry.filename.replace("\\", "/"))
                                  if (relative.is_absolute() or ".." in relative.parts
                                          or any(":" in p for p in relative.parts)
                                          or (entry.external_attr >> 16) & 0o170000 == 0o120000):
                                      raise RuntimeError(f"Unsafe ZIP entry: {entry.filename}")
                                  target = site.joinpath(*relative.parts)
                                  if entry.is_dir() or entry.filename.endswith(("/", "\\")):
                                      target.mkdir(parents=True, exist_ok=True)
                                  else:
                                      target.parent.mkdir(parents=True, exist_ok=True)
                                      with archive.open(entry) as inp, target.open("wb") as out:
                                          shutil.copyfileobj(inp, out)
                      else:
                          (site / "maps").mkdir(exist_ok=True)
                          shutil.copyfile(package, site / "maps" / name)
          
              # Repository uploads take precedence over release contents.
              for name in ("maps", "models", "materials", "sound", "sounds", "resource",
                           "scripts", "particles", "gfx", "notices"):
                  source = workspace / name
                  if source.is_dir():
                      shutil.copytree(source, site / name, dirs_exist_ok=True)
              for name in ("index.html", "CNAME", ".nojekyll"):
                  source = workspace / name
                  if source.is_file():
                      shutil.copy2(source, site / name)
              (site / ".nojekyll").touch()
              if not (site / "index.html").is_file():
                  raise RuntimeError("The site needs index.html in the repository or a release ZIP")
              files = [p for p in site.rglob("*") if p.is_file()]
              print(f"Prepared {len(files)} files, {sum(p.stat().st_size for p in files):,} bytes")
              return site
          
          
          if __name__ == "__main__":
              repo = os.environ["GITHUB_REPOSITORY"]
              pages = json.loads(subprocess.check_output([
                  "gh", "api", f"repos/{repo}/releases?per_page=100", "--paginate", "--slurp"
              ], text=True))
          
              def download(release, asset, target):
                  subprocess.run([
                      "gh", "release", "download", release["tag_name"], "--repo", repo,
                      "--pattern", asset["name"], "--output", str(target)
                  ], check=True)
          
              build(Path.cwd(), [r for page in pages for r in page], download)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
