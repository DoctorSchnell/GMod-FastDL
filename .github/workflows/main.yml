name: Deploy FastDL

on:
  push:
    branches: [main]

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, or leave blank for the latest release"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Automatically deploy stable releases only.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Read files from main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Download release content
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          args=(
            --repo "$GITHUB_REPOSITORY"
            --pattern "*-pages-*.zip"
            --output "$RUNNER_TEMP/payload.zip"
          )

          if [ -n "$RELEASE_TAG" ]; then
            args+=("$RELEASE_TAG")
          fi

          gh release download "${args[@]}"
          mkdir -p public
          unzip -q "$RUNNER_TEMP/payload.zip" -d public

      - name: Add repository files
        shell: bash
        run: |
          set -euo pipefail

          # Repository files override matching release files.
          for dir in maps models materials sound resource scripts particles gfx notices; do
            if [ -d "$dir" ]; then
              mkdir -p "public/$dir"
              cp -a "$dir/." "public/$dir/"
            fi
          done

          for file in index.html .nojekyll CNAME; do
            if [ -f "$file" ]; then
              cp "$file" "public/$file"
            fi
          done

      - name: Check prepared site
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/.nojekyll
          test -d public/materials
          test -d public/models
          test -d public/sound
          test -d public/notices

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
